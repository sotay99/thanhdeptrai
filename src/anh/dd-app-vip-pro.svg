<rect x="104" y="48" width="48" height="48" rx="12" fill="#ffd479"/>
<rect x="160" y="48" width="48" height="48" rx="12" fill="#31a8ff"/>
<rect x="48" y="104" width="48" height="48" rx="12" fill="#2d9d5f"/>
<rect x="104" y="104" width="48" height="48" rx="12" fill="#c04bd6"/>
<rect x="160" y="104" width="48" height="48" rx="12" fill="#4a86c9"/>
